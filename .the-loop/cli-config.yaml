version: 0.9.0
state:
  root: .the-loop
webhooks:
  ghWebhook:
    enabled: false
    host: 127.0.0.1
    port: 8787
    path: /gh-webhook
    secretEnv: THE_LOOP_GH_WEBHOOK_SECRET
    pidfile: .the-loop/gh-webhook.pid
    events: []
routing:
  enabled: true
  registryDir: .the-loop/sessions
  defaultHarness: claude
  spawnOnUnmatched: labeled
  autoExecuteLabel: 'the-loop: auto-execute'
  control:
    enabled: true
    requireStartCommand: true
    keywords:
      start: the-loop start
      stop: the-loop stop
      pause: the-loop pause
      resume: the-loop resume
      do: the-loop do
      cleanup: the-loop cleanup
  interaction:
    mode: work-item
  graph:
    enabled: true
  authorizedUsers:
  - MadaraUchiha-314
  spawnWorkdir: .
  workspace:
    root: ~/.the-loop/workspace
    strategy: worktree
    cloneProtocol: ssh
    defaultHost: github.com
    keepCheckoutOnClose: false
    gitBinary: git
  maxConcurrentDispatches: 4
  dedupCacheSize: 1024
  dispatchTimeoutSeconds: 1800
  promptTemplate: skills/the-loop/templates/webhook-event-prompt.md
  spawnPromptTemplate: skills/the-loop/templates/webhook-autoexecute-prompt.md
  harnessArgs:
    claude:
    - --dangerously-skip-permissions
    cursor:
    - --force
  harnessTrust:
    enabled: true
    scope: workspace-root
    acceptBypassPermissions: auto
  harnessPlugins:
    enabled: true
    marketplaceRepo: MadaraUchiha-314/the-loop
  reactions:
    enabled: true
    started: eyes
    completed: hooray
    error: confused
  tmux:
    keepSessionOnClose: true
    remainOnExit: true
    resumeOnRespawn: true
    resumeProbeSeconds: 2
    killHarnessOnClose: true
    harnessKillGraceSeconds: 5
  announce:
    enabled: true
standingSessions:
  enabled: false
  sessions: []
polling:
  enabled: true
  intervalSeconds: 60
  sources:
  - provider: github
    monitor:
      issues: true
      pullRequests: true
    label: ''
service:
  enabled: true
  mcp:
    enabled: true
  stream:
    enabled: true
    maxSubscribers: 8
    keepAliveSeconds: 15
  hostIngresses: false
  cors:
    allowOrigins:
    - https://madarauchiha-314.github.io
    allowMethods:
    - GET
    - POST
    - OPTIONS
    allowHeaders:
    - Accept
    - Content-Type
    allowCredentials: false
    allowPrivateNetwork: true
eventLog:
  enabled: true
  path: .the-loop/logs/events.jsonl
selfDiagnosis:
  enabled: false
  repo: MadaraUchiha-314/the-loop
  label: 'the-loop: self-diagnosed'
  harness: claude
  model: ''
  timeoutSeconds: 900
  intervalSeconds: 3600
  maxIssuesPerDay: 5
  maxRetries: 3
integrations:
  github:
    transport: auto
    api:
      tokenEnv:
      - GH_TOKEN
      - GITHUB_TOKEN
      baseUrl: https://api.github.com
    cli:
      binary: gh
channels:
  slack:
    enabled: false
repositories:
- MadaraUchiha-314/devbox
- MadaraUchiha-314/the-loop

# Review-round policy, moved from harness-config.yaml `reviews` (issue-352,
# decision-123); the agent reads it back with `the-loop critic policy`.
reviews:
  selfReviewCount: 2              # cap; the loop stops early on zero new findings
  criticReviewCount: 1            # cap; rounds with the critics[] below
  stopOnNoNewFindings: true       # stop when a round finds nothing new actionable
  escalateOnRepeatFinding: true   # same finding twice in a row -> escalate to a human

# Critic harnesses (moved from harness-config.yaml `reviews.critics`, issue-352).
# Executable configuration: review an entry like code.
critics: []
