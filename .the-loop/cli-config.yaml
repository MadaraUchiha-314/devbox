version: 0.12.0
env:
  file: ~/.the-loop/the-loop.env
state:
  root: .the-loop
webhooks:
  ghWebhook:
    enabled: false
    host: 127.0.0.1
    port: 8787
    path: /gh-webhook
    secretEnv: THE_LOOP_GH_WEBHOOK_SECRET
    pidfile: .the-loop/gh-webhook.pid
    events: []
routing:
  enabled: true
  registryDir: .the-loop/sessions
  defaultHarness: claude
  spawnOnUnmatched: labeled
  control:
    enabled: true
    requireStartCommand: true
    keywords:
      start: the-loop start
      stop: the-loop stop
      pause: the-loop pause
      resume: the-loop resume
      do: the-loop do
      cleanup: the-loop cleanup
  interaction:
    mode: work-item
  graph:
    enabled: true
  authorizedUsers:
  - MadaraUchiha-314
  spawnWorkdir: .
  workspace:
    root: ~/.the-loop/workspace
    strategy: worktree
    cloneProtocol: ssh
    defaultHost: github.com
    keepCheckoutOnClose: false
    gitBinary: git
  maxConcurrentDispatches: 4
  dedupCacheSize: 1024
  dispatchTimeoutSeconds: 1800
  promptTemplate: skills/the-loop/templates/webhook-event-prompt.md
  spawnPromptTemplate: skills/the-loop/templates/webhook-autoexecute-prompt.md
  harnessTrust:
    enabled: true
    scope: workspace-root
    acceptBypassPermissions: auto
  harnessPlugins:
    enabled: true
    marketplaceRepo: MadaraUchiha-314/the-loop
  reactions:
    enabled: true
    started: eyes
    completed: hooray
    error: confused
  tmux:
    keepSessionOnClose: true
    remainOnExit: true
    resumeOnRespawn: true
    resumeProbeSeconds: 2
    killHarnessOnClose: true
    harnessKillGraceSeconds: 5
  announce:
    enabled: true
  autoExecuteLabels:
  - 'the-loop: auto-execute'
  - 'the-loop: rr'
  ci:
    autofix: true
    maxAttempts: 3
harnesses:
- name: claude
  default: true
  defaultModel: claude-opus-5-5
  args:
  - --dangerously-skip-permissions
- name: codex
  defaultModel: gpt-6.1-sol
  args:
  - --dangerously-bypass-approvals-and-sandbox
- name: cursor
  defaultModel: gpt-6.1-sol
  args:
  - --force
models:
- name: claude-fable-5-1
  harnesses: [claude]
- name: claude-opus-5-5
  harnesses: [claude]
- name: claude-sonnet-5-5
  harnesses: [claude]
- name: claude-haiku-4-5-20251001
  harnesses: [claude]
- name: gpt-6.1-sol
  harnesses: [codex, cursor]
- name: gpt-6-sol
  harnesses: [codex, cursor]
- name: gpt-6-astra
  harnesses: [codex, cursor]
- name: gpt-6-luna
  harnesses: [codex, cursor]
- name: gpt-5.6-sol
  harnesses: [codex, cursor]
- name: gpt-5.6-terra
  harnesses: [codex, cursor]
- name: gpt-5.6-luna
  harnesses: [codex, cursor]
- name: gpt-5.5
  harnesses: [codex, cursor]
effort:
- low
- medium
- high
- xhigh
standingSessions:
  enabled: false
  sessions: []
polling:
  enabled: true
  intervalSeconds: 60
  ci:
    enabled: true
    intervalSeconds: 300
  sources:
  - provider: github
    monitor:
      issues: true
      pullRequests: true
service:
  enabled: true
  mcp:
    enabled: true
  stream:
    enabled: true
    maxSubscribers: 8
    keepAliveSeconds: 15
  hostIngresses: false
  cors:
    allowOrigins:
    - https://madarauchiha-314.github.io
    allowMethods:
    - GET
    - POST
    - OPTIONS
    allowHeaders:
    - Accept
    - Content-Type
    allowCredentials: false
    allowPrivateNetwork: true
eventLog:
  enabled: true
  path: .the-loop/logs/events.jsonl
selfDiagnosis:
  enabled: false
  repo: MadaraUchiha-314/the-loop
  label: 'the-loop: self-diagnosed'
  harness: claude
  model: ''
  timeoutSeconds: 900
  intervalSeconds: 3600
  maxIssuesPerDay: 5
  maxRetries: 3
integrations:
  github:
    api:
      tokenEnv:
      - THE_LOOP_GH_TOKEN
      - GH_TOKEN
      - GITHUB_TOKEN
      baseUrl: https://api.github.com
channels:
  slack:
    enabled: false
  jira:
    enabled: false
    subscribe:
    - session.awaiting_input
    verbosity: normal
repositories:
- MadaraUchiha-314/devbox
- MadaraUchiha-314/the-loop
- MadaraUchiha-314/the-loop-testing
- MadaraUchiha-314/yaah
reviews:
  selfReviewCount: 2
  criticReviewCount: 1
  stopOnNoNewFindings: true
  escalateOnRepeatFinding: true
critics:
- name: codex
  harness: codex
  model: gpt-6.1-sol
